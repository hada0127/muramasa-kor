<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Muramasa UI 텍스처 편집기</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <!-- 좌: 파일 목록 -->
  <aside id="filelist">
    <header>
      <input id="search" type="search" placeholder="해시·메모·설명 검색…">
      <div id="filters">
        <label><input type="checkbox" class="sysfilter" value="localize" checked> localize</label>
        <label><input type="checkbox" class="sysfilter" value="place" checked> place</label>
        <label><input type="checkbox" class="sysfilter" value="manual" checked> manual</label>
      </div>
    </header>
    <ul id="files"></ul>
    <footer id="liststat"></footer>
  </aside>

  <!-- 중: 캔버스 -->
  <main id="editor">
    <div id="toolbar">
      <span id="cur-hash" class="muted">파일을 선택하세요</span>
      <span class="spacer"></span>
      <label>배경
        <select id="bg-color">
          <option value="checker" selected>체커</option>
          <option value="black">검정</option>
          <option value="red">레드</option>
          <option value="blue">블루</option>
        </select>
      </label>
      <label>원본 투명도 <input type="range" id="orig-opacity" min="0" max="100" value="50" style="width:90px"> <span id="orig-opacity-val" class="muted">50%</span></label>
      <label>줌
        <select id="zoom">
          <option value="fit" selected>맞춤</option>
          <option value="0.25">25%</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
      </label>
      <button id="btn-add">＋영역</button>
      <button id="btn-render" class="primary">저장 및 미리보기</button>
    </div>
    <div id="memo-bar">
      <label>메모</label>
      <input id="memo-input" type="text" placeholder="이 파일이 무엇인지 메모 (목록에 표시됨)">
      <button id="btn-memo">메모 저장</button>
    </div>
    <div id="canvas-wrap">
      <div id="stage">
        <img id="tex-img" alt="">       <!-- 실제 렌더 결과 (정확) -->
        <img id="orig-img" alt="">      <!-- 원본 아트 (투명도 오버레이, 참조용) -->
        <div id="overlay"></div>
      </div>
    </div>
  </main>

  <!-- 우: 속성 -->
  <aside id="props">
    <h2>속성</h2>
    <div id="props-empty" class="muted">영역을 선택하세요</div>
    <div id="props-form" hidden></div>
    <div id="props-actions" hidden>
      <button id="btn-copy-style">스타일 복사</button>
      <button id="btn-paste-style">붙여넣기</button>
      <button id="btn-del" class="danger">영역 삭제</button>
    </div>
  </aside>
</div>

<!-- 생성 미리보기 모달 -->
<div id="modal" hidden>
  <div class="modal-box">
    <header>
      <span id="modal-title">생성 미리보기</span>
      <button id="modal-close">✕</button>
    </header>
    <div class="modal-body">
      <div class="modal-bgsel">
        배경
        <button data-bg="checker" class="active">체커</button>
        <button data-bg="black">검정</button>
        <button data-bg="white">흰</button>
      </div>
      <div id="modal-imgwrap" class="bg-checker"><img id="modal-img" alt="preview"></div>
      <pre id="modal-log"></pre>
    </div>
  </div>
</div>

<div id="spinner" hidden><div class="spin"></div><div class="spin-label">이미지 생성 중…</div></div>
<div id="toast"></div>
<script src="/static/app.js?v=blur6"></script>
</body>
</html>
