name: Build Windows GUI Patcher

# 파이썬 설치 없이 더블클릭으로 쓰는 Windows exe(MuramasaPatcher.exe)를 빌드한다.
# exe 는 코드 + numpy/pillow/xxhash 만 담는다(데이터 자산·원본 CPK 불필요).
# 데이터 자산은 메인테이너가 build_release.py 로 따로 만들어 exe 와 합쳐 배포한다.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy xxhash pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm MuramasaPatcher.spec

      - name: Smoke test (import only, no GUI)
        run: |
          python -c "import sys; sys.path.insert(0,'tools'); import gui_patcher; print('PKG_ROOT', gui_patcher.PKG_ROOT)"

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuramasaPatcher-windows
          path: dist/MuramasaPatcher.exe
          if-no-files-found: error
          # 릴리스 첨부는 tools/publish_release.py 가 일괄 수행한다(통합 번들 + 단독 exe).
          # 여기서는 빌드 검증 + 다운로드 가능한 아티팩트 제공까지만 한다.
